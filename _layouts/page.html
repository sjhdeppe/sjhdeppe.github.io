---
layout: default
---

<div id="main" class="alt">
  <section id="one">
    <div class="inner">
      <header class="major">
        <h1>{{ page.title }}</h1>
      </header>
      {% if page.image %}
        <span class="image main"><img src="{{ page.image | relative_url }}" alt="" /></span>
      {% endif %}

      {{ content }}

    </div>
  </section>
</div>
